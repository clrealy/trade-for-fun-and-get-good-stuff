<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#5b2a9c"/><stop offset=".6" stop-color="#241238"/><stop offset="1" stop-color="#0d0812"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#d9dde6"/><stop offset="1" stop-color="#9aa2b3"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g id="art">
  <!-- red glow behind the knife -->
  <ellipse cx="256" cy="232" rx="150" ry="150" fill="#ff2a3d" opacity=".35" filter="url(#glow)"/>
  <!-- knife, tip up and to the right -->
  <g transform="rotate(-40 256 240)">
    <path d="M232 70 L280 70 Q300 180 280 300 L232 300 Z" fill="url(#blade)" stroke="#2a2233" stroke-width="8" stroke-linejoin="round"/>
    <path d="M232 70 Q246 40 258 30 Q272 44 280 70 Z" fill="#eef1f6" stroke="#2a2233" stroke-width="8" stroke-linejoin="round"/>
    <rect x="244" y="96" width="10" height="180" rx="5" fill="#b9bfcc"/>
    <rect x="196" y="296" width="120" height="30" rx="10" fill="#3a3d47" stroke="#1a1820" stroke-width="8"/>
    <rect x="234" y="326" width="44" height="108" rx="14" fill="#5a3a1e" stroke="#1a1820" stroke-width="8"/>
    <circle cx="256" cy="446" r="20" fill="#3a3d47" stroke="#1a1820" stroke-width="8"/>
  </g>
  <!-- blood drop -->
  <path d="M150 214 Q172 246 172 264 A22 22 0 0 1 128 264 Q128 246 150 214 Z" fill="#ff2a3d" stroke="#5c0010" stroke-width="6"/>
  </g>
</svg>
